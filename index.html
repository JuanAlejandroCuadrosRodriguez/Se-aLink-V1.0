<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SeñaLink · Comunicación sin barreras</title>
  <meta name="description" content="SeñaLink: comunicación presencial entre personas sordas y agentes de ventanilla. Señas a texto y voz, respuestas escritas en grande.">
  <meta name="theme-color" content="#123c5a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#view">Saltar al contenido</a>

  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="#preparar" aria-label="SeñaLink, inicio">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0"/><path d="M14 10V4a2 2 0 0 0-4 0v2"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-6-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>
        </span>
        <span class="brand-name">SeñaLink</span>
        <span class="brand-tag">Comunicación sin barreras</span>
      </a>
      <p class="location">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 5-8 12-8 12s-8-7-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>
        <span id="location">Atención presencial</span>
      </p>
    </div>
  </header>

  <nav class="stepper" id="stepper" aria-label="Pasos de la atención">
    <div class="wrap stepper-inner">
      <ol class="steps">
        <li><button type="button" class="step" data-step="1" data-route="preparar"><span class="step-n">1</span><span class="step-l">Preparar</span></button></li>
        <li><button type="button" class="step" data-step="2" data-route="conversar"><span class="step-n">2</span><span class="step-l">Conversar</span></button></li>
        <li><button type="button" class="step" data-step="3" data-route="leer"><span class="step-n">3</span><span class="step-l">Leer respuesta</span></button></li>
      </ol>
      <p class="stepper-tag">En el mismo lugar. A tu ritmo.</p>
    </div>
  </nav>

  <main id="view" class="wrap" tabindex="-1"></main>

  <footer class="footbar">
    <div class="wrap footbar-inner">
      <p class="with-icon">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
        <span id="foot-note"></span>
      </p>
      <div class="foot-links">
        <a href="#config">Configuración</a>
        <button type="button" class="link-btn strong" id="help">Ayuda de accesibilidad</button>
      </div>
    </div>
  </footer>

  <!-- Vídeo que alimenta al reconocedor de señas (no visible). -->
  <video id="proc-video" class="proc-video" muted playsinline autoplay aria-hidden="true"></video>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog" class="dialog"></dialog>

  <noscript><p class="wrap">SeñaLink necesita JavaScript activado.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
